# Enabled alongside production only on the Fargate tasks.
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 45s

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  stock-sync:
    enabled: false
  seed:
    test-user-count: 0
