name: Blue-Green Lab GitOps

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_gitops:
        description: Deploy the published image by updating the lab values in Git
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blue-green-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify-java.yml

  dependency-scan:
    name: Java dependency scan
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: build/libs
      - name: Scan packaged Java dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_LIST_ALL_PKGS: 'true'
        with:
          scan-type: rootfs
          scan-ref: build/libs
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-java.json
      - name: Enforce dependency scan results
        shell: bash
        run: |
          packages=$(jq '[.Results[]? | select(.Type == "jar") | .Packages[]?] | length' trivy-java.json)
          if (( packages == 0 )); then
            echo '::error::Trivy did not identify any packaged Java dependencies.'
            exit 1
          fi
          echo "Scanned $packages packaged Java dependencies."
          jq -r '.Results[]?.Vulnerabilities[]? | [.VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion, .Severity] | @tsv' trivy-java.json
          if ! jq -e 'all(.Results[]?; (.Vulnerabilities // []) | length == 0)' trivy-java.json >/dev/null; then
            echo '::error::Fixable HIGH or CRITICAL Java vulnerabilities were found.'
            exit 1
          fi

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-blue-green.yml
    with:
      image-repository: ghcr.io/workspace-v2/community-service-blue-green-lab
      gitops-repository: workspace-v2/k8s-pilot
      gitops-branch: main
      helm-chart: lab/blue-green
      helm-release: burger-lab
      namespace: blue-green-lab
      update-gitops: ${{ inputs.update_gitops }}
    permissions:
      contents: read
      packages: write
    secrets:
      gitops-token: ${{ secrets.GITOPS_REPO_TOKEN }}
