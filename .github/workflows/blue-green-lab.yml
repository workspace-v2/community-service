name: Blue-Green Lab GitOps

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_gitops:
        description: Deploy the published image by updating the lab values in Git
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blue-green-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            app:
              - 'src/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradlew'
              - 'gradle/**'
              - 'Dockerfile*'
              - '.dockerignore'
              - 'Dockerfile*.dockerignore'
              - '.github/**'

  verify:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.app == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/verify-java.yml

  dependency-scan:
    name: Java dependency scan
    needs: [changes, verify]
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/scan-java-jar

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-blue-green.yml
    with:
      image-repository: ghcr.io/workspace-v2/community-service-blue-green-lab
      gitops-repository: workspace-v2/k8s-pilot
      gitops-branch: main
      helm-chart: lab/blue-green
      helm-release: burger-lab
      namespace: blue-green-lab
      update-gitops: ${{ inputs.update_gitops }}
    permissions:
      contents: read
      packages: write
    secrets:
      gitops-token: ${{ secrets.GITOPS_REPO_TOKEN }}
