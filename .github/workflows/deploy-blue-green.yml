name: Publish and Deploy a Blue-Green Image

on:
  workflow_call:
    inputs:
      image-repository:
        type: string
        required: true
      gitops-repository:
        type: string
        required: true
      gitops-branch:
        type: string
        required: true
      helm-chart:
        type: string
        required: true
      helm-release:
        type: string
        required: true
      namespace:
        type: string
        required: true
      update-gitops:
        type: boolean
        default: false
    secrets:
      gitops-token:
        required: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    env:
      IMAGE_TAG: ${{ inputs.image-repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: build/libs
      - uses: docker/setup-buildx-action@v3
      - name: Package the verified JAR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ecs
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_TAG }}
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the scanned image and record its digest
        id: push
        shell: bash
        run: |
          docker push "$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image-ref=$IMAGE_TAG@$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    needs: publish
    if: inputs.update-gitops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require GitOps write access
        env:
          GITOPS_TOKEN: ${{ secrets.gitops-token }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::GITOPS_REPO_TOKEN is required to update the GitOps repository."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          ref: ${{ inputs.gitops-branch }}
          token: ${{ secrets.gitops-token }}
      - name: Update and validate lab values
        shell: bash
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image-ref }}
          HELM_CHART: ${{ inputs.helm-chart }}
          HELM_RELEASE: ${{ inputs.helm-release }}
          NAMESPACE: ${{ inputs.namespace }}
          GITOPS_BRANCH: ${{ inputs.gitops-branch }}
        run: |
          values="$HELM_CHART/values-gitops.yaml"
          yq -e 'has("image") and has("lab")' "$values" >/dev/null
          yq -i '.image.ref = strenv(IMAGE_REF) | .lab.revision = strenv(GITHUB_SHA)' "$values"
          helm lint "$HELM_CHART" --values "$values"
          helm template "$HELM_RELEASE" "$HELM_CHART" --namespace "$NAMESPACE" --values "$values" >/dev/null

          git add -- "$values"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(deploy): update $HELM_RELEASE to ${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$GITOPS_BRANCH"
