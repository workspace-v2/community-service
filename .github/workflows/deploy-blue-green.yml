name: Publish and Deploy a Blue-Green Image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile.ecs
      image-repository:
        type: string
        required: true
      gitops-repository:
        type: string
        required: true
      gitops-branch:
        type: string
        required: true
      helm-chart:
        type: string
        required: true
      helm-release:
        type: string
        required: true
      namespace:
        type: string
        required: true
      update-gitops:
        type: boolean
        default: false
      gitops-app-client-id:
        type: string
        default: ''
    secrets:
      gitops-token:
        required: false
      gitops-app-private-key:
        required: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    env:
      IMAGE_TAG: ${{ inputs.image-repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: build/libs
      - uses: docker/setup-buildx-action@v3
      - name: Package the verified JAR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_TAG }}
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the scanned image and record its digest
        id: push
        shell: bash
        run: |
          docker push "$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image-ref=$IMAGE_TAG@$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    needs: publish
    if: inputs.update-gitops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require GitOps write access
        env:
          GITOPS_TOKEN: ${{ secrets.gitops-token }}
          GITOPS_APP_CLIENT_ID: ${{ inputs.gitops-app-client-id }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.gitops-app-private-key }}
        run: |
          if [[ -n "$GITOPS_APP_CLIENT_ID" ]]; then
            if [[ -z "$GITOPS_APP_PRIVATE_KEY" ]]; then
              echo "::error::A GitHub App private key is required with a GitOps App client ID."
              exit 1
            fi
          elif [[ -z "$GITOPS_TOKEN" ]]; then
            echo "::error::A GitHub App or GitOps repository token is required for updates."
            exit 1
          fi
      - name: Resolve GitHub App token scope
        if: inputs.gitops-app-client-id != ''
        id: gitops-target
        env:
          GITOPS_REPOSITORY: ${{ inputs.gitops-repository }}
        run: |
          if [[ ! "$GITOPS_REPOSITORY" =~ ^([a-zA-Z0-9-]+)/([a-zA-Z0-9_.-]+)$ ]]; then
            echo "::error::The GitOps repository must use the owner/repository format."
            exit 1
          fi
          printf 'owner=%s\nrepository=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - name: Create scoped GitOps installation token
        if: inputs.gitops-app-client-id != ''
        id: gitops-app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ inputs.gitops-app-client-id }}
          private-key: ${{ secrets.gitops-app-private-key }}
          owner: ${{ steps.gitops-target.outputs.owner }}
          repositories: ${{ steps.gitops-target.outputs.repository }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          ref: ${{ inputs.gitops-branch }}
          token: ${{ steps.gitops-app-token.outputs.token || secrets.gitops-token }}
      - name: Update and validate lab values
        shell: bash
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image-ref }}
          HELM_CHART: ${{ inputs.helm-chart }}
          HELM_RELEASE: ${{ inputs.helm-release }}
          NAMESPACE: ${{ inputs.namespace }}
          GITOPS_BRANCH: ${{ inputs.gitops-branch }}
          GITOPS_APP_SLUG: ${{ steps.gitops-app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.gitops-app-token.outputs.token }}
        run: |
          values="$HELM_CHART/values-gitops.yaml"
          yq -e 'has("image") and has("lab")' "$values" >/dev/null
          yq -i '.image.ref = strenv(IMAGE_REF) | .lab.revision = strenv(GITHUB_SHA)' "$values"
          helm lint "$HELM_CHART" --values "$values"
          helm template "$HELM_RELEASE" "$HELM_CHART" --namespace "$NAMESPACE" --values "$values" >/dev/null

          git add -- "$values"
          if git diff --cached --quiet; then
            exit 0
          fi
          author='github-actions[bot]'
          author_id=41898282
          if [[ -n "$GITOPS_APP_SLUG" ]]; then
            author="$GITOPS_APP_SLUG[bot]"
            author_id=$(gh api "/users/$author" --jq .id)
          fi
          git config user.name "$author"
          git config user.email "$author_id+$author@users.noreply.github.com"
          git commit -m "chore(deploy): update $HELM_RELEASE to ${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$GITOPS_BRANCH"
